# Build settings for Hostinger, which installs with pnpm 11. pnpm 11 stops
# the install when a dependency's build script has not been approved, so
# approve the two that have one (both also ship prebuilt binaries).
allowBuilds:
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
# pnpm 11 on Hostinger rejects lockfile entries published less than a day
# ago (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION). Apply the same rule locally
# (minutes) so a fresh lockfile never pulls in a package that new.
minimumReleaseAge: 2880
